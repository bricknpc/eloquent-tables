# Mago is the single tool enforcing formatting, linting and static analysis here. It replaced
# PHP-CS-Fixer and PHPStan. See "The quality gate" in AGENTS.md.
#
# Nothing here is specific to this package beyond the paths, so the file can be lifted to
# another Laravel codebase by changing [source] alone.

# The language floor, not the ceiling: composer.json allows ^8.4|^8.5. Analysing against the
# floor is what catches syntax the lowest supported version would reject. CI overrides this
# per matrix job with --php-version, because Laravel 12 and 13 resolve different vendor code.
php-version = "8.4"

[source]
# Formatting and linting cover everything PHP-CS-Fixer covered. The analyzer is narrowed
# separately below, because paths here apply to every tool.
paths = ["src", "tests", "config"]

# vendor is a symbol source, never an analysis target. Without it the analyzer cannot resolve
# a single Illuminate class and reports 616 issues against src rather than 90.
includes = ["vendor"]

[formatter]
# 120 matches what the code already does: 99% of lines are under 107 characters and only 42
# exceed 120. PHP-CS-Fixer enforced no width, so this is a new choice rather than a port.
print-width = 120

# Ports 'ordered_imports' => ['sort_algorithm' => 'length'].
sort-uses = "length-ascending"

# Ports 'binary_operator_spaces' => ['default' => 'align'].
align-assignment-like = true

# Ports 'concat_space' => ['spacing' => 'one'].
space-around-concatenation-binary-operator = true

# Ports 'trailing_comma_in_multiline'. Mago defaults this on; stated so the port is visible.
trailing-comma = true

[analyzer]
# Whole checks held off, as opposed to the per-site pragmas in src. These fire on a pattern that is
# inherent to using Laravel rather than on anything this package chooses: the container, the
# translator and the request helpers all hand back `mixed`, so every assignment from one of them
# reports. Roughly 18 findings, none actionable without annotating every such assignment.
#
# redundant-docblock-type is here for a different reason: the five @var annotations it flags are
# kept on purpose. They document what an untyped container call or attribute instantiation hands
# back, which is worth stating for a reader even where the analyzer can work it out. Removing @var
# annotations is also what broke the analysis during this migration, so they are left alone.
ignore = ["mixed-assignment", "mixed-operand", "redundant-docblock-type"]

# tests are deliberately unanalysed. Pointing the analyzer at them adds ~1000 findings, most of
# them the fixture-nullability pattern that kept tests out of PHPStan too. Closing that gap is
# its own issue; do not widen this without taking that work on.
excludes = ["tests", "config"]

[linter]
# The linter is advisory: it has no minimum-fail-level of its own, and severity is carried by each
# rule's own `level`. No enabled rule sits at Error, so `mago lint` reports but never fails. That
# is deliberate. The hard formatting gate PHP-CS-Fixer used to provide is replaced by
# `mago format --dry-run`, not by this. To make a style rule blocking, set its level to "Error".

# PHPUnit methods here are snake_case. Ports 'php_unit_method_casing' => ['case' => 'snake_case'],
# which was an active rule, so the Mago rule is enabled rather than left at its default off.
[linter.rules.method-name]
enabled = true
use-snake-case-for-tests = true

# Complexity metrics are off on purpose. Neither PHP-CS-Fixer nor PHPStan enforced them, and
# they report 15 errors against existing src. Turning them on is a refactor, not a tooling
# swap. Enable them as their own change, with the refactoring that implies.
[linter.rules.too-many-methods]
enabled = false

[linter.rules.cyclomatic-complexity]
enabled = false

[linter.rules.kan-defect]
enabled = false

[linter.rules.halstead]
enabled = false

[linter.rules.excessive-parameter-list]
enabled = false

[linter.rules.too-many-enum-cases]
enabled = false

# Off because its auto-fix is unsafe in this codebase, not because the advice is wrong. The fix
# collapses `$x = expr(); return $x;` into `return expr();` but leaves the `/** @var T $x */`
# docblock above it in place. That orphans the annotation and drops the narrowing the return
# relied on: applying it across src produced 28 PHPStan errors and 12 Mago errors, all of the
# form "Variable $x in PHPDoc tag @var does not exist". This codebase leans on @var narrowing,
# so the rule is a poor fit until the fixer also rewrites the docblock.
[linter.rules.inline-variable-return]
enabled = false

# Off as a poor fit rather than a broken fix. It wants every literal named, which reads worse for
# well-known signatures: json_decode($cookie, associative: true) and str_repeat('x', times: 100).
# 46 findings, none of which would improve a line.
[linter.rules.literal-named-argument]
enabled = false

# Off because its auto-fix is destructive: converting a closure to an arrow function deletes any
# comment inside it and drops a declared return type, turning
# `static function (X $c): bool { ... }` into `static fn (X $c) => ...`. The style itself is a
# matter of taste; silently losing a return type is not.
[linter.rules.prefer-arrow-function]
enabled = false

# Off for the same class of reason: rewriting an explicit two-parameter closure to `$this->m(...)`
# changes the callable's arity contract.
[linter.rules.prefer-first-class-callable]
enabled = false

# Off because todo comments are used deliberately here to mark known trade-offs, and a rule that
# flags every one of them just adds noise to the ones already written down.
[linter.rules.tagged-todo]
enabled = false

# Off because the functions it flags, dropdownActions() and groupedActions(), are public API in an
# autoloaded src/helpers.php. Renaming them to satisfy a naming convention would break consumers.
[linter.rules.function-name]
enabled = false

# Off as a style opinion this codebase does not share: `glob(...) ?: []` is the idiomatic guard for
# a function returning array|false, and spelling it out in full reads worse.
[linter.rules.no-shorthand-ternary]
enabled = false

# Off as a design opinion. A defaulted bool flag such as build(..., bool $forceReload = false) is a
# reasonable API here, and the alternative the rule pushes towards is a larger change than it is
# worth.
[linter.rules.no-boolean-flag-parameter]
enabled = false

# Off because the sites it flags are genuine two-way branches, not guard clauses. Early return is
# the better shape when one arm is an exit; when both arms do work, `else` says what is meant.
[linter.rules.no-else-clause]
enabled = false
