name: Eloquent Tables CI

on:
  # Long-lived branches are named after a version and never contain a slash: the major
  # branches ("2.x", a later "3.x") and the next release branch ("2.1"). A single "*"
  # matches exactly those, because "*" does not match "/". Short-lived feature/*, bugfix/*
  # and hotfix/* branches are therefore excluded here and covered by the pull_request
  # trigger instead, so a branch without a PR does not burn a run and a branch with one is
  # not checked twice. Do not narrow this to "*.x": that silently skips a next release
  # branch like "2.1", which is where almost all work lands.
  push:
    branches:
      - "*"
  pull_request:
    branches: [ "**" ]

# Every job gets read-only access. The Pages deployment raises its own permissions,
# so a compromised third-party action in a test job has nothing worth stealing.
permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php-version }}, Laravel ${{ matrix.laravel }})
    runs-on: ubuntu-latest

    # id-token lets the Codecov upload authenticate with a short-lived OIDC token
    # instead of a stored secret.
    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']
        laravel: ['12', '13']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, dom, filter, gd, json, pdo
          coverage: xdebug

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-laravel-${{ matrix.laravel }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-version }}-laravel-${{ matrix.laravel }}-

      - name: Install dependencies against Laravel ${{ matrix.laravel }}
        run: composer update --with="illuminate/support:^${{ matrix.laravel }}.0" --prefer-dist --no-progress

      - name: Run PHPUnit tests with coverage
        run: vendor/bin/phpunit --coverage-text --coverage-cobertura=coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: matrix.php-version == '8.5' && matrix.laravel == '12'
        with:
          use_oidc: true
          files: ./coverage.xml
          fail_ci_if_error: true
          verbose: true

      - name: Get coverage percentage
        if: matrix.php-version == '8.5' && matrix.laravel == '12'
        id: coverage
        run: |
          COVERAGE=$(php -r "
            \$xml = simplexml_load_file('coverage.xml');
            \$metrics = \$xml->xpath('//coverage')[0];
            \$lineRate = floatval(\$metrics['line-rate']) * 100;
            echo number_format(\$lineRate, 2);
          ")
          echo "current=$COVERAGE" >> $GITHUB_OUTPUT
          echo "Current coverage: $COVERAGE%"

      - name: Download previous coverage
        if: matrix.php-version == '8.5' && matrix.laravel == '12'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: previous-coverage.txt
          key: coverage-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            coverage-${{ github.ref }}-

      - name: Compare coverage
        if: matrix.php-version == '8.5' && matrix.laravel == '12'
        run: |
          CURRENT_COVERAGE=${{ steps.coverage.outputs.current }}
          
          if [ -f previous-coverage.txt ]; then
            PREVIOUS_COVERAGE=$(cat previous-coverage.txt)
            echo "Previous coverage: $PREVIOUS_COVERAGE%"
            echo "Current coverage: $CURRENT_COVERAGE%"
          
            if (( $(echo "$CURRENT_COVERAGE < $PREVIOUS_COVERAGE" | bc -l) )); then
              echo "❌ Coverage decreased from $PREVIOUS_COVERAGE% to $CURRENT_COVERAGE%"
              exit 1
            else
              echo "✅ Coverage maintained or improved: $PREVIOUS_COVERAGE% → $CURRENT_COVERAGE%"
            fi
          else
            echo "No previous coverage found. Current coverage: $CURRENT_COVERAGE%"
          fi
          
          echo "$CURRENT_COVERAGE" > previous-coverage.txt

      - name: Save current coverage
        if: matrix.php-version == '8.5' && matrix.laravel == '12' && always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: previous-coverage.txt
          key: coverage-${{ github.ref }}-${{ github.sha }}

  phpstan:
    name: PHPStan (PHP ${{ matrix.php-version }}, Laravel ${{ matrix.laravel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']
        laravel: ['12', '13']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, dom, filter, gd, json, pdo

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-laravel-${{ matrix.laravel }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-version }}-laravel-${{ matrix.laravel }}-

      - name: Install dependencies against Laravel ${{ matrix.laravel }}
        run: composer update --with="illuminate/support:^${{ matrix.laravel }}.0" --prefer-dist --no-progress

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --error-format=github

  php-cs-fixer:
    name: PHP-CS-Fixer (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, dom, filter, gd, json, pdo

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-version }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHP-CS-Fixer (dry-run)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --verbose --allow-risky=yes --config=.php-cs-fixer.php

  # Builds the site and nothing else: no environment, no pages permission, no upload or
  # deploy step, so it cannot touch what is published. onBrokenLinks is 'throw', so this is
  # also what validates every internal link and anchor.
  #
  # It exists because a dependency bump can break the build without touching a line of PHP,
  # and the deploy job only builds on the default branch, so a break would otherwise stay
  # hidden until release. Runs in parallel with the PHP jobs, so it costs no wall clock.
  docs-build:
    name: Build documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: ./docs
        run: npm ci

      - name: Build Docusaurus
        working-directory: ./docs
        run: npm run build

  deploy-docs:
    name: Deploy documentation
    runs-on: ubuntu-latest
    # Only deploy from the repository's default branch, which is the current major version
    # branch and tracks the released state. Comparing against default_branch rather than a
    # hardcoded name means the next major taking over as default needs no change here, and
    # keeps unreleased documentation on the next release branch out of the published site.
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: [phpunit, phpstan, php-cs-fixer]

    # Scoped to this job on purpose. As a workflow-level key it serialised every run of the
    # whole workflow repo-wide, so a push to one branch queued behind another branch's tests.
    # Here it does what the intent always was: one deployment at a time, tests still parallel.
    # In-progress runs are not cancelled, so a deployment already going always finishes.
    concurrency:
      group: "pages"
      cancel-in-progress: false

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: ./docs
        run: npm ci

      - name: Build Docusaurus
        working-directory: ./docs
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./docs/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0